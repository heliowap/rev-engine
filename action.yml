name: Rev Engine Prime review
description: Reviews a pull request with a model when a maintainer asks, and posts the findings as one review.

inputs:
  openrouter-api-key:
    description: OpenRouter API key. Pass it from a repository secret.
    required: true
  github-token:
    description: Token used to read the pull request and post the review.
    default: ${{ github.token }}
  pr-number:
    description: Pull request to review. Leave empty when the workflow is started by a comment on a pull request.
    default: ""
  command:
    description: A comment starts a review only when it is this text, or this text followed by a space. "/review agent" asks for an agent review and "/review human" for a human one.
    default: /review
  mode:
    description: The review to run when the comment does not say, or when the workflow is started by hand. "human" reviews with the model below and comments on the most severe findings. "agent" reviews with a fast swarm and lists every finding in one comment, for an agent that manages the pull request.
    default: human
  agent-model:
    description: OpenRouter model the swarm of an agent review uses.
    default: deepseek/deepseek-v4.1-flash-1017
  swarm-effort:
    description: Agent reviews only. Reasoning effort for the swarm's agents, for models that accept one.
    default: none
  model:
    description: OpenRouter model that reviews and verifies.
    default: anthropic/claude-opus-5.5
  model-base-url:
    description: OpenAI-compatible chat completions endpoint the models are called through.
    default: https://openrouter.ai/api/v1
  min-severity:
    description: The least severe findings that get a comment. One of high, medium or low. Less severe findings are listed in a collapsed section of the summary.
    default: medium
  max-findings:
    description: Cap on the number of findings that get a comment. Findings past the cap join the collapsed section.
    default: "10"
  fit:
    description: Set to "on" to also say whether the change belongs in the project, judged by the goals and design the project states.
    default: "on"
  time-budget:
    description: Seconds allowed for the review.
    default: "780"
  allow-forks:
    description: Set to "true" to review pull requests from forks. Their code is only read, never run.
    default: "false"
  max-turns:
    description: Model turns allowed per review or verification pass. Empty keeps the reviewer's default.
    default: ""
  second-look:
    description: Human reviews only. What a reviewer does after its first submission. on asks it to look again for what it missed, sweep and sweep-low go through the changed hunks, small looks for small problems, and off skips it. Empty keeps the reviewer's default.
    default: ""
  effort:
    description: Human reviews only. Reasoning effort, for models that accept one. Empty keeps the provider's default.
    default: ""
  wrap-up:
    description: Human reviews only. Seconds each review, verification and fit pass keeps back at the end to write its submission. Empty keeps the reviewer's default.
    default: ""
  runtime:
    description: Where the review step runs. docker builds and runs the image. node runs the code with Node 24 on a self-hosted runner prepared with action/node/provision.sh, with the review step as a separate user that holds only the model key.
    default: docker
  feedback:
    description: Set to "true" when the hosted feedback action records a receipt for each accepted request. This run then asks the status workflow to sync that receipt. See docs/INSTALL.md.
    default: "false"
  feedback-workflow:
    description: File name of the status workflow, on the default branch, that the feedback sync runs in.
    default: review-status.yml
  feedback-token:
    description: Token used only to start the status workflow. It never posts a review, and the model step never gets it.
    default: ${{ github.token }}
  review-author:
    description: Login of the account that posts the review. With feedback on, a review by any other account is not confirmed as published. Use the same value as the feedback workflows.
    default: github-actions[bot]

outputs:
  review-url:
    description: The URL of the review this run published. Empty when no review was posted.
    value: ${{ steps.post.outputs.review-url || steps.post-node.outputs.review-url }}

runs:
  using: composite
  steps:
    # Everything from the event is passed through the environment and never
    # written into a script, because comment text is untrusted.
    - name: Check who asked
      id: ask
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.event.comment.user.login || github.actor }}
        COMMENT: ${{ github.event.comment.body }}
        COMMENT_ON_PR: ${{ github.event.issue.pull_request.url }}
        EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        INPUT_NUMBER: ${{ inputs.pr-number }}
        COMMAND: ${{ inputs.command }}
        MODE: ${{ inputs.mode }}
        ALLOW_FORKS: ${{ inputs.allow-forks }}
        RUNTIME: ${{ inputs.runtime }}
      # The shared gate in action/ask.sh, also used by the hosted feedback action.
      run: bash "$GITHUB_ACTION_PATH/action/ask.sh"

    # With feedback on, asks the status workflow to sync this run's receipt. It holds the feedback token
    # and no other secret. A failure is only a warning: the review still runs, and the status workflow's
    # completion watcher and its manual run bring the receipt up to date.
    - name: Announce execution
      if: steps.ask.outputs.run == 'true' && inputs.feedback == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.feedback-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        WORKFLOW: ${{ inputs.feedback-workflow }}
        REF: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        if jq -cn --arg ref "$REF" --arg run "$RUN_ID" '{ref: $ref, inputs: {"run-id": $run}}' \
          | gh api --method POST "repos/$REPO/actions/workflows/$WORKFLOW/dispatches" --input - > /dev/null 2>&1; then
          echo "Requested the feedback sync for run $RUN_ID."
        else
          echo "::warning::Could not request the feedback sync for run $RUN_ID. The review continues. Run the Review feedback workflow by hand with this run ID to bring the receipt up to date."
        fi

    # The reviewer needs only the head tree and the base commit, so the checkout is shallow.
    # The token is not kept in the checkout, because the model can read files there.
    - name: Check out the pull request
      if: steps.ask.outputs.run == 'true'
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.ask.outputs.head }}
        fetch-depth: 1
        path: rev-engine-prime-checkout
        persist-credentials: false
        token: ${{ inputs.github-token }}

    # The compare API gives the diff without history; action/diff.sh falls back to git.
    - name: Write the diff
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'docker'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        BASE: ${{ steps.ask.outputs.base }}
        HEAD: ${{ steps.ask.outputs.head }}
        PULL_JSON: ${{ runner.temp }}/rev-engine-prime/pull.json
        CHECKOUT: ${{ github.workspace }}/rev-engine-prime-checkout
        OUT: ${{ runner.temp }}/rev-engine-prime/pr/diff.patch
      run: bash "$GITHUB_ACTION_PATH/action/diff.sh"

    # The node runtime's diff, and its collector run alongside it. The collector holds the GitHub
    # token and no model key, as in the docker runtime, and its failure is only a warning. The review
    # step runs after this step, so it waits for both.
    - name: Write the diff and collect earlier decisions (node)
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'node'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        REPO: ${{ github.repository }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        BASE: ${{ steps.ask.outputs.base }}
        HEAD: ${{ steps.ask.outputs.head }}
        PULL_JSON: ${{ runner.temp }}/rev-engine-prime/pull.json
        CHECKOUT: ${{ github.workspace }}/rev-engine-prime-checkout
        OUT: ${{ runner.temp }}/rev-engine-prime/pr/diff.patch
        PRIOR_PATH: ${{ runner.temp }}/rev-engine-prime/pr/prior.json
      run: |
        set -euo pipefail
        /opt/rev-engine-node/bin/node "$GITHUB_ACTION_PATH/action/collect.ts" &
        collector=$!
        status=0
        bash "$GITHUB_ACTION_PATH/action/diff.sh" || status=$?
        wait "$collector" || echo "::warning::Earlier decisions not collected: the collector exited with an error"
        exit "$status"

    # The review settings, from review-env.sh. They hold no secret, so this step gets none.
    - name: Write the review settings
      if: steps.ask.outputs.run == 'true'
      shell: bash
      env:
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        RB_BASE: ${{ steps.ask.outputs.base }}
        RB_HEAD: ${{ steps.ask.outputs.head }}
        RB_MODEL_BASE_URL: ${{ inputs.model-base-url }}
        RB_CONFIG_MODEL: ${{ inputs.model }}
        RB_CONFIG_TIME_BUDGET: ${{ inputs.time-budget }}
        RB_CONFIG_FIT: ${{ inputs.fit == 'on' && inputs.model || '' }}
        RB_CONFIG_MAX_TURNS: ${{ inputs.max-turns }}
        RB_CONFIG_SECOND_LOOK: ${{ inputs.second-look }}
        RB_CONFIG_EFFORT: ${{ inputs.effort }}
        RB_CONFIG_WRAP_UP: ${{ inputs.wrap-up }}
        MODE: ${{ steps.ask.outputs.mode }}
        AGENT_MODEL: ${{ inputs.agent-model }}
        SWARM_EFFORT: ${{ inputs.swarm-effort }}
      run: bash "$GITHUB_ACTION_PATH/action/review-env.sh" > "$RUNNER_TEMP/rev-engine-prime/review.env"

    - name: Build the reviewer
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'docker'
      shell: bash
      run: docker build --quiet --tag rev-engine-prime:action "$GITHUB_ACTION_PATH"

    # The maintainer's decisions on earlier reviews of this pull request, so the review does not
    # report decided findings again. It holds the GitHub token and no model key. A failure is
    # logged as a warning and leaves no file, and the review then runs without earlier decisions.
    - name: Collect earlier decisions
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'docker'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
      run: |
        docker run --rm --entrypoint node \
          -v "$GITHUB_ACTION_PATH/action:/agent/action:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime/pr:/work/pr" \
          -e GITHUB_TOKEN -e GITHUB_API_URL -e GITHUB_GRAPHQL_URL -e RB_NWO -e RB_PR_NUMBER -e PRIOR_PATH=/work/pr/prior.json \
          rev-engine-prime:action /agent/action/collect.ts \
          || echo "::warning::Earlier decisions not collected: the collector exited with an error"

    - name: Review
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'docker'
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: |
        set -euo pipefail
        # The settings, including an agent review's swarm settings, come from review.env.
        docker run --rm --env-file "$RUNNER_TEMP/rev-engine-prime/review.env" \
          -v "$GITHUB_WORKSPACE/rev-engine-prime-checkout:/work/repo:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime/pr:/work/pr:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime/out:/work/out" \
          -e OPENROUTER_API_KEY -e RB_DETAILS_OUT=/work/out/details.json \
          -e RB_REPO=/work/repo -e RB_DIFF=/work/pr/diff.patch -e RB_PR_JSON=/work/pr/pr.json -e RB_PRIOR_JSON=/work/pr/prior.json \
          -e RB_OUT=/work/out/findings.json \
          rev-engine-prime:action

    # The node runtime's review: the model key and no GitHub token. review.sh runs the review as
    # the reviewer user and copies its JSON output back.
    - name: Review (node)
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'node'
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: bash "$GITHUB_ACTION_PATH/action/node/review.sh"

    # Keep the findings with their severities and kinds, so a review can later be
    # turned into an eval case with evals/add.ts. They hold nothing the posted review does not.
    - name: Save the review
      if: steps.ask.outputs.run == 'true' && !cancelled()
      uses: actions/upload-artifact@v4
      with:
        name: rev-engine-prime-pr-${{ steps.ask.outputs.number }}
        path: ${{ runner.temp }}/rev-engine-prime/out/*.json
        if-no-files-found: ignore

    # The docker runtime runs the posting script in the same image, so the runner needs no Node of
    # its own. The node runtime runs it with the provisioned Node, below.
    # It gets the GitHub token and no model key; the review above gets the model key and no GitHub token.
    - name: Post the review
      id: post
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'docker'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        RB_HEAD: ${{ steps.ask.outputs.head }}
        REVIEW_MODEL: ${{ steps.ask.outputs.mode == 'agent' && format('a swarm of {0} agents', inputs.agent-model) || inputs.model }}
        REVIEW_MODE: ${{ steps.ask.outputs.mode }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MAX_COMMENTS: ${{ inputs.max-findings }}
        FEEDBACK_RUN_ID: ${{ inputs.feedback == 'true' && github.run_id || '' }}
        FEEDBACK_RUN_ATTEMPT: ${{ inputs.feedback == 'true' && github.run_attempt || '' }}
        REVIEW_AUTHOR: ${{ inputs.review-author }}
      run: |
        set -euo pipefail
        # The publication goes to a file on the host, so the container never gets GITHUB_OUTPUT.
        publication="$RUNNER_TEMP/rev-engine-prime/publication.json"
        docker run --rm --entrypoint node \
          -v "$GITHUB_ACTION_PATH/action:/agent/action:ro" \
          -v "$RUNNER_TEMP/rev-engine-prime:/work:ro" \
          -e GITHUB_TOKEN -e GITHUB_API_URL -e GITHUB_GRAPHQL_URL -e RB_NWO -e RB_PR_NUMBER -e RB_HEAD -e REVIEW_MODEL -e REVIEW_MODE -e MIN_SEVERITY -e MAX_COMMENTS \
          -e FEEDBACK_RUN_ID -e FEEDBACK_RUN_ATTEMPT -e REVIEW_AUTHOR \
          -e FINDINGS_PATH=/work/out/details.json -e FIT_PATH=/work/out/fit.json -e DIFF_PATH=/work/pr/diff.patch \
          rev-engine-prime:action /agent/action/post.ts > "$publication"
        echo "review-url=$(jq -r '.url // empty' "$publication")" >> "$GITHUB_OUTPUT"

    # The node runtime's post: the GitHub token and no model key. The findings are the details file
    # the review wrote, and the fit file and diff are the same ones the docker runtime reads.
    - name: Post the review (node)
      id: post-node
      if: steps.ask.outputs.run == 'true' && inputs.runtime == 'node'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
        RB_NWO: ${{ github.repository }}
        RB_PR_NUMBER: ${{ steps.ask.outputs.number }}
        RB_HEAD: ${{ steps.ask.outputs.head }}
        REVIEW_MODEL: ${{ steps.ask.outputs.mode == 'agent' && format('a swarm of {0} agents', inputs.agent-model) || inputs.model }}
        REVIEW_MODE: ${{ steps.ask.outputs.mode }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MAX_COMMENTS: ${{ inputs.max-findings }}
        FEEDBACK_RUN_ID: ${{ inputs.feedback == 'true' && github.run_id || '' }}
        FEEDBACK_RUN_ATTEMPT: ${{ inputs.feedback == 'true' && github.run_attempt || '' }}
        REVIEW_AUTHOR: ${{ inputs.review-author }}
        FINDINGS_PATH: ${{ runner.temp }}/rev-engine-prime/out/details.json
        FIT_PATH: ${{ runner.temp }}/rev-engine-prime/out/fit.json
        DIFF_PATH: ${{ runner.temp }}/rev-engine-prime/pr/diff.patch
      run: |
        set -euo pipefail
        publication="$RUNNER_TEMP/rev-engine-prime/publication.json"
        /opt/rev-engine-node/bin/node "$GITHUB_ACTION_PATH/action/post.ts" > "$publication"
        echo "review-url=$(jq -r '.url // empty' "$publication")" >> "$GITHUB_OUTPUT"
