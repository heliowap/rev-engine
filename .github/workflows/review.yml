# Reviews a pull request in this repository with RevEngine itself.
# A person with write access comments /review on a pull request, or runs this workflow with a pull request number.
# The accept job writes the request's receipt before the review job may start. Install this file and
# review-status.yml together on the default branch.
name: Review
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number
        required: true
      mode:
        description: human or agent
        default: human
permissions:
  contents: read
  pull-requests: write
jobs:
  accept:
    name: Accept the review request
    # Coarse only: the shared gate in action/ask.sh reads the command, so no prefix is parsed here.
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    concurrency:
      group: rev-engine-feedback-${{ github.repository_id }}-${{ github.run_id }}
      cancel-in-progress: false
    outputs:
      accepted: ${{ steps.feedback.outputs.accepted }}
      number: ${{ steps.feedback.outputs.number }}
      mode: ${{ steps.feedback.outputs.mode }}
      comment-id: ${{ steps.feedback.outputs.comment-id }}
      run-id: ${{ steps.feedback.outputs.run-id }}
    steps:
      - id: feedback
        uses: heliowap/rev-engine/feedback@main
        with:
          phase: accept
          pr-number: ${{ inputs.pr-number }}
          mode: ${{ inputs.mode || 'human' }}
          review-author: ${{ vars.REV_ENGINE_REVIEW_AUTHOR || 'github-actions[bot]' }}
  review:
    name: Review pull request
    needs: accept
    if: needs.accept.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      actions: write
    concurrency:
      group: rev-engine-review-${{ github.repository_id }}-${{ needs.accept.outputs.number }}
      cancel-in-progress: true
    steps:
      - uses: heliowap/rev-engine@main
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          pr-number: ${{ inputs.pr-number }}
          mode: ${{ inputs.mode || 'human' }}
          feedback: 'true'
          review-author: ${{ vars.REV_ENGINE_REVIEW_AUTHOR || 'github-actions[bot]' }}
